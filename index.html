<!DOCTYPE html>
<html lang="sw" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact</title>
<meta name="theme-color" content="#f8fafd">
<meta name="description" content="Contact — hifadhi anwani zako salama, offline.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#fff;--bg2:#f1f3f4;--sf:#f8fafd;--tx:#1f1f1f;--tx2:#5f6368;--bd:#e1e3e6;--pr:#0b57d0;--prbg:#d3e3fd;--prtx:#041e49;--dg:#b3261e;--ok:#188038;--card:#f6f8fc;--sh:0 1px 2px #0003,0 2px 6px 2px #00000014;color-scheme:light}
:root[data-theme=dark]{--bg:#1f1f1f;--bg2:#2d2e30;--sf:#131314;--tx:#e3e3e3;--tx2:#a8abaf;--bd:#3c4043;--pr:#a8c7fa;--prbg:#0842a0;--prtx:#d3e3fd;--dg:#f2b8b5;--ok:#81c995;--card:#282a2c;--sh:0 1px 2px #000a,0 2px 6px 2px #0006;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1f1f1f;--bg2:#2d2e30;--sf:#131314;--tx:#e3e3e3;--tx2:#a8abaf;--bd:#3c4043;--pr:#a8c7fa;--prbg:#0842a0;--prtx:#d3e3fd;--dg:#f2b8b5;--ok:#81c995;--card:#282a2c;--sh:0 1px 2px #000a,0 2px 6px 2px #0006;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:15px/1.45 "Google Sans",Roboto,system-ui,sans-serif;background:var(--sf);color:var(--tx);overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.hide{display:none!important}
.muted{color:var(--tx2)}
small{font-size:12.5px}
.ic{fill:currentColor;flex:none}
.btn{padding:10px 22px;border-radius:22px;font-weight:500;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.p{background:var(--pr);color:var(--bg)}
.btn.t{color:var(--pr)}.btn.t:hover{background:var(--prbg)}
.btn.o{border:1px solid var(--bd);color:var(--pr);text-decoration:none}
.btn.dg{background:var(--dg);color:var(--bg)}
.btn.d{color:var(--dg)}
.btn.w{width:100%}
.ib{width:44px;height:44px;border-radius:50%;color:var(--tx2);display:inline-grid;place-items:center;flex:none;text-decoration:none}
.ib:hover{background:var(--bg2)}
.ib.sm{width:40px;height:40px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);min-height:44px}
input[type=checkbox]{width:auto;min-height:0}
textarea{resize:vertical;min-height:80px}
label{display:block;color:var(--tx2);font-size:12.5px;margin:14px 0 4px}
h3{margin:0 0 6px;font-weight:500;font-size:20px}
.err{color:var(--dg);min-height:20px;margin:8px 0;font-size:13.5px}
.ok{color:var(--pr)}
/* overlays */
.ov{position:fixed;inset:0;background:var(--sf);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:28px;padding:32px 28px;width:100%;max-width:400px;text-align:center;box-shadow:var(--sh);animation:up .25s}
.card h1{font-size:24px;font-weight:400;margin:10px 0 6px}
.card p{color:var(--tx2);margin:0 0 16px}
.card input{margin-bottom:10px}
.card .btn{width:100%;margin-top:6px}
.logo{width:60px;height:60px;border-radius:18px;background:var(--pr);color:var(--bg);display:inline-grid;place-items:center}
.lnk{color:var(--pr);margin-top:10px;display:inline-block;padding:8px;min-height:40px}
.or{color:var(--tx2);margin:12px 0 4px;font-size:12px}
.langs{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.langs button{padding:6px 12px;border-radius:14px;border:1px solid var(--bd);font-size:13px}
.langs button.on{background:var(--prbg);color:var(--prtx)}
/* shell */
#app{height:100%;display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr auto;background:var(--sf)}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;color:var(--tx2);min-width:0}
.brand i{font-style:normal;width:34px;height:34px;border-radius:10px;background:var(--pr);color:var(--bg);display:grid;place-items:center;flex:none}
.brand span{display:none}
.search{flex:1;max-width:720px;display:flex;align-items:center;background:var(--bg2);border-radius:26px;padding:0 6px 0 14px;color:var(--tx2);gap:8px;transition:box-shadow .2s}
.search:focus-within{box-shadow:var(--sh);background:var(--bg)}
.search input{border:0;background:none;height:48px;padding:0;min-height:0;outline:0}
.sp{flex:1}
header .sp{display:none}
main{background:var(--bg);border-radius:22px;overflow:auto;margin:0 8px;position:relative;scroll-behavior:smooth}
#view{padding-bottom:110px;animation:fade .2s}
#nav{display:flex;justify-content:space-around;padding:6px 6px calc(8px + env(safe-area-inset-bottom));background:var(--sf)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--tx2);min-height:56px;padding-top:4px;border-radius:16px}
.nb .pill{width:62px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .2s}
.nb.on{color:var(--tx);font-weight:600}.nb.on .pill{background:var(--prbg);color:var(--prtx)}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:18px;background:var(--prbg);color:var(--prtx);display:grid;place-items:center;box-shadow:var(--sh);z-index:6;transition:transform .15s}
.fab:active{transform:scale(.94)}
@media(min-width:900px){
 #app{grid-template-columns:100px 1fr;grid-template-rows:auto 1fr}
 header{grid-column:2}.brand span{display:inline}
 main{grid-column:2;margin:0 12px 12px 0}
 #nav{grid-row:1/3;grid-column:1;flex-direction:column;justify-content:flex-start;gap:6px;padding-top:16px}
 .nb{flex:none;min-height:64px}
 .fab{bottom:32px;right:32px}
}
/* views */
.top{padding:18px 20px 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.top h2{margin:0;font-weight:400;font-size:24px}
.sec-t{padding:14px 20px 6px;color:var(--tx2);font-weight:600;font-size:13px;letter-spacing:.03em;text-transform:uppercase}
.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:6px 16px}
.stat{background:var(--card);border-radius:18px;padding:14px 12px;text-align:left;min-height:68px}
.stat b{display:block;font-size:26px;font-weight:400;line-height:1.1}.stat span{color:var(--tx2);font-size:12.5px}
.hs{display:flex;gap:10px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.mini{display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;flex:none;font-size:12.5px;padding:6px 0;border-radius:14px}
.mini:hover{background:var(--bg2)}
.mini span{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner{margin:6px 16px;padding:8px 8px 8px 16px;border-radius:16px;background:var(--prbg);color:var(--prtx);display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:14px}
.banner span{flex:1;min-width:0}
.banner .btn{color:var(--prtx);border:1px solid currentColor;min-height:38px;padding:6px 14px;flex:none;white-space:nowrap}
.ltr{padding:16px 20px 4px;color:var(--pr);font-weight:600;scroll-margin-top:8px}
.row{display:flex;align-items:center;gap:12px;padding:6px 8px 6px 16px;min-height:60px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background .12s}
.row:hover{background:var(--bg2)}
.row.sel{background:var(--prbg)}
.nmc{min-width:0;flex:1}
.nmc b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nmc small{display:block;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.compact .row{min-height:48px}body.compact .row .av{width:30px;height:30px;font-size:14px}
.star{color:var(--tx2)}.star.on{color:#f9ab00}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;color:#fff;display:grid;place-items:center;font-size:18px;flex:none}
.av.big{width:104px;height:104px;font-size:46px}
.cb{width:22px;height:22px;border-radius:6px;border:2px solid var(--tx2);display:grid;place-items:center;flex:none;color:var(--bg)}
.cb.on{background:var(--pr);border-color:var(--pr)}
.idx{position:fixed;right:2px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;z-index:4;font-size:10.5px;color:var(--tx2);max-height:60vh;overflow:hidden}
.idx button{padding:1px 6px;line-height:1.25}
.empty{padding:56px 24px;text-align:center;color:var(--tx2)}
.empty .big{width:88px;height:88px;border-radius:50%;background:var(--card);display:inline-grid;place-items:center;margin-bottom:12px}
.empty .btn{margin:6px 4px}
.selbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:2px;padding:6px 8px;background:var(--prbg);color:var(--prtx);flex-wrap:wrap}
.selbar b{flex:1;padding-left:6px;min-width:70px}
.selbar .ib{color:var(--prtx)}
.chipbar{display:flex;align-items:center;gap:8px;padding:6px 16px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:16px;background:var(--bg2);font-size:13.5px;cursor:pointer;border:1px solid transparent}
.chip.on{background:var(--prbg);color:var(--prtx)}
.chip button{display:inline-grid;color:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0}
.gcard{display:flex;align-items:center;gap:14px;padding:10px 8px 10px 16px;min-height:64px;cursor:pointer}
.gcard:hover{background:var(--bg2)}
.gic{width:44px;height:44px;border-radius:14px;background:var(--prbg);color:var(--prtx);display:grid;place-items:center;flex:none}
.dupc{margin:8px 16px;padding:12px 14px;border-radius:18px;background:var(--card)}
.dupc .nmc{padding:3px 0}
/* settings */
.scard{margin:10px 16px;border-radius:22px;background:var(--card);padding:6px 0;overflow:hidden}
.scard>h4{margin:0;padding:14px 18px 6px;font-size:13px;color:var(--pr);text-transform:uppercase;letter-spacing:.04em}
.scard p,.scard .pad{padding:2px 18px 8px;margin:0}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 18px;min-height:52px}
.srow>label,.srow>div{margin:0;color:var(--tx);font-size:15px;flex:1}
.srow small{display:block;color:var(--tx2)}
.srow select,.srow input[type=text]{width:auto;max-width:55%;min-width:120px}
.li{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:8px 18px;min-height:56px}
.li:hover{background:var(--bg2)}
.li .lic{width:38px;height:38px;border-radius:12px;background:var(--bg2);color:var(--pr);display:grid;place-items:center;flex:none}
.li .lt{flex:1;min-width:0}.li .lt b{display:block;font-weight:500}.li .lt small{color:var(--tx2);display:block}
.li.dgr .lic{color:var(--dg)}.li.dgr b{color:var(--dg)}
.sw{position:relative;flex:none;width:52px;height:32px;margin:0}
.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:16px;background:var(--bg2);border:2px solid var(--tx2);transition:.2s}
.sw i::after{content:"";position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:50%;background:var(--tx2);transition:.2s}
.sw input:checked+i{background:var(--pr);border-color:var(--pr)}
.sw input:checked+i::after{background:var(--bg);left:24px;top:4px;width:20px;height:20px}
/* dialogs */
dialog{border:0;border-radius:28px;padding:0;background:var(--bg);color:var(--tx);width:min(580px,100vw);max-width:100vw;margin:auto;max-height:92vh;box-shadow:0 8px 40px #0006;overflow:auto}
dialog[open]{animation:up .22s}
dialog::backdrop{background:#0007;animation:fade .2s}
.dh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 0;gap:4px;position:sticky;top:0;background:var(--bg);z-index:2}
.dt{font-size:18px;font-weight:500;padding-left:8px}
.db{padding:8px 22px 20px}
.df{display:flex;justify-content:flex-end;gap:8px;padding:10px 20px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--bd);position:sticky;bottom:0;background:var(--bg);flex-wrap:wrap}
#cDlg{width:min(420px,92vw);border-radius:28px}
#cDlg .db{padding:22px 24px 8px}
#cDlg .df{border:0;position:static}
#sheet{width:min(520px,100vw);margin:auto auto 0;border-radius:28px 28px 0 0;padding-bottom:env(safe-area-inset-bottom)}
#sheet[open]{animation:sheet .22s}
.sh-t{padding:16px 22px 6px;font-weight:600;color:var(--tx2)}
.shi{display:flex;align-items:center;gap:18px;width:100%;padding:0 22px;min-height:52px;text-align:left}
.shi:hover{background:var(--bg2)}.shi.dgr{color:var(--dg)}
.hero{text-align:center;padding:4px 0 12px}
.hero h3{font-size:26px;font-weight:400;margin:12px 0 2px}.hero p{margin:0;color:var(--tx2)}
.acts{display:flex;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts a{flex-direction:column;gap:4px;border-radius:18px;padding:10px 14px;min-width:76px;font-size:13px;height:auto}
.it{display:flex;gap:16px;padding:12px 0;align-items:flex-start;border-top:1px solid var(--bd)}
.it>.ic{margin-top:2px;color:var(--tx2)}
.it>div{flex:1;min-width:0;word-break:break-word}
.it small{display:block;color:var(--tx2)}
.it a{color:var(--pr);text-decoration:none}
.it .ib{width:40px;height:40px}
.rw{display:grid;grid-template-columns:104px 1fr 44px;gap:8px;margin-bottom:8px;align-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.ml{max-height:46vh;overflow:auto;margin:8px -8px}
.ck{display:flex;align-items:center;gap:12px;padding:8px;min-height:48px;margin:0;color:var(--tx);font-size:15px;border-radius:12px;cursor:pointer}
.ck:hover{background:var(--bg2)}.ck input{width:20px;height:20px;flex:none}
.pv{background:var(--card);border-radius:16px;padding:12px 14px;margin:10px 0;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#323232;color:#fff;padding:12px 20px;border-radius:14px;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;display:flex;align-items:center;gap:8px;box-shadow:var(--sh)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.act{pointer-events:auto}
#toast.er{background:#8c1d18}#toast.sc{background:#0d652d}
#toast button{color:#8ab4f8;margin-left:12px;font-weight:600;padding:6px}
.spin{width:26px;height:26px;border:3px solid var(--bd);border-top-color:var(--pr);border-radius:50%;animation:rot .8s linear infinite;margin:0 auto 10px}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(max-width:620px){
 dialog:not(#cDlg):not(#sheet){max-width:none;margin:0;max-height:100dvh;height:100dvh;border-radius:0;width:100vw}
 .g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr}
 .rw{grid-template-columns:96px 1fr 44px}
}
</style>
</head>
<body>

<div id="boot" class="ov" style="z-index:60"><div style="text-align:center"><div class="spin"></div><span class="muted" id="bootMsg">…</span></div></div>

<!-- KARIBU -->
<div id="wel" class="ov hide">
 <form class="card" id="welForm">
  <div class="langs"><button type="button" data-act="setlang" data-v="sw">Kiswahili</button><button type="button" data-act="setlang" data-v="en">English</button></div>
  <div class="logo" data-svg="person"></div>
  <h1 data-i="welcome_t"></h1>
  <p data-i="welcome_p"></p>
  <input id="wP1" type="password" data-ph="pw_ph" autocomplete="new-password">
  <input id="wP2" type="password" data-ph="pw2_ph" autocomplete="new-password">
  <div class="err" id="wErr"></div>
  <button class="btn p" type="submit" data-i="w_set"></button>
  <button class="lnk" id="wSkip" type="button" data-i="w_skip"></button>
 </form>
</div>

<!-- LOCK -->
<div id="lock" class="ov hide">
 <form class="card" id="lockForm">
  <div class="logo" data-svg="lock"></div>
  <h1 data-i="locked_t"></h1>
  <p data-i="locked_p"></p>
  <input id="lPass" type="password" data-ph="pw_one" autocomplete="off">
  <div class="err" id="lErr"></div>
  <button class="btn p" type="submit" data-i="unlock"></button>
  <button class="btn t hide" id="lBio" type="button" data-act="bioun" style="border:1px solid var(--bd)" data-i="bio_use"></button>
  <button class="lnk" id="lForgot" type="button" data-i="forgot"></button>
  <div id="lReset" class="hide">
   <p id="lRtxt" style="margin-top:12px"></p>
   <input id="lRpass" type="password" data-ph="acc_pw" autocomplete="current-password">
   <button class="btn t" id="lRgo" type="button" style="border:1px solid var(--bd)"></button>
   <button class="btn d" id="lRwipe" type="button" data-i="wipe_local"></button>
  </div>
 </form>
</div>

<!-- APP -->
<div id="app" class="hide">
 <header>
  <div class="brand"><i data-svg="person"></i><span data-i="app"></span></div>
  <div class="search" id="search"><span data-svg="search"></span><input id="q" type="search" data-ph="search_ph" data-al="search_ph" autocomplete="off"></div>
  <span class="sp"></span>
  <button class="ib hide" id="lockBtn" data-act="locknow" data-al="lock_now" data-svg="lock"></button>
 </header>
 <main id="main"><div id="view"></div></main>
 <nav id="nav" aria-label="Menu">
  <button class="nb on" data-act="nav" data-v="contacts"><span class="pill" data-svg="person"></span><span data-i="nav_contacts"></span></button>
  <button class="nb" data-act="nav" data-v="favs"><span class="pill" data-svg="star_border"></span><span data-i="nav_favs"></span></button>
  <button class="nb" data-act="nav" data-v="groups"><span class="pill" data-svg="group"></span><span data-i="nav_groups"></span></button>
  <button class="nb" data-act="nav" data-v="settings"><span class="pill" data-svg="settings"></span><span data-i="nav_settings"></span></button>
 </nav>
 <button class="fab" id="fab" data-act="fab" data-al="add_contact" data-svg="add" data-sz="28"></button>
</div>
<div class="idx hide" id="idx"></div>

<input type="file" id="impIn" multiple accept=".vcf,.csv,text/vcard,text/x-vcard,text/csv" class="hide">
<input type="file" id="bkIn" accept=".json,application/json" class="hide">
<input type="file" id="photoIn" accept="image/*" class="hide">
<input type="file" id="camIn" accept="image/*" capture="user" class="hide">

<!-- PROFILE -->
<dialog id="dDlg"><div id="dBox"></div></dialog>

<!-- FORM -->
<dialog id="fDlg">
 <form id="fForm" method="dialog" novalidate>
  <div class="dh"><b class="dt" id="fTitle"></b><button class="ib" type="button" data-close data-al="close" data-svg="close"></button></div>
  <div class="db">
   <div class="ph"><div id="fAv"></div>
    <button class="btn t" type="button" data-act="phgal"><span data-svg="image" data-sz="20"></span><span data-i="gallery"></span></button>
    <button class="btn t" type="button" data-act="phcam"><span data-svg="camera" data-sz="20"></span><span data-i="camera"></span></button>
    <button class="btn d" type="button" data-act="phdel" id="phDel" data-i="remove"></button></div>

function mergeC(p,others,lab){
 lab=lab||(k=>k);
 const m={...p,phones:[...p.phones],emails:[...p.emails],labels:[...p.labels]};
 const ps=new Set(m.phones.map(x=>pk(x.v)||x.v)),es=new Set(m.emails.map(x=>x.v.toLowerCase()));
 const extra=[];
 for(const o of others){
  for(const ph of o.phones){const k=pk(ph.v)||ph.v;if(!ps.has(k)){ps.add(k);m.phones.push(ph)}}
  for(const em of o.emails){const k=em.v.toLowerCase();if(!es.has(k)){es.add(k);m.emails.push(em)}}
  for(const l of o.labels)if(!m.labels.includes(l))m.labels.push(l);
  m.fav=m.fav||o.fav;
  for(const f of ['first','middle','last','company','title','address','web','bday']){
   if(!m[f]&&o[f])m[f]=o[f];
   else if(o[f]&&m[f]&&o[f].toLowerCase()!==m[f].toLowerCase())extra.push(`${lab('f_'+f)}: ${o[f]}`)}
  if(!m.photo&&o.photo)m.photo=o.photo;
  if(o.notes&&!m.notes.includes(o.notes))m.notes=[m.notes,o.notes].filter(Boolean).join('\n')}
 if(extra.length)m.notes=[m.notes,lab('merged_note')+'\n'+[...new Set(extra)].join('\n')].filter(Boolean).join('\n\n');
 m.updated=Date.now();return m}

let unsub=null,reconciled=false,stok=0;
function setSync(k,msg){syncKey=k;const e=$('#syncTxt');if(e){e.textContent=t(k);e.title=msg||''}}
const canCloud=()=>!!(fs&&cloudUser);
const cdoc=id=>fs.collection('users').doc(cloudUser.uid).collection('contacts').doc(id);
function cloudErr(e){
 if(e&&e.code==='permission-denied'){setSync('sy_err','permission-denied');toast(t('rules_err'),'er')}
 else if(e&&e.code==='unavailable')setSync('sy_wait');
 else setSync('sy_err',(e&&e.message)||'')}
const forCloud=c=>{const r={...c};if(JSON.stringify(r).length>900000)r.photo='';return r};
function cloudPut(c){if(canCloud())cdoc(c.id).set(forCloud(c)).catch(cloudErr)}
function cloudDel(id){if(canCloud())cdoc(id).set({id,deleted:true,updated:Date.now()}).catch(cloudErr)}
async function cloudBatch(list,mk){if(!canCloud()||!list.length)return;
 try{for(let i=0;i<list.length;i+=400){const b=fs.batch();list.slice(i,i+400).forEach(c=>b.set(cdoc(c.id),mk(c)));await b.commit()}}catch(e){cloudErr(e)}}
const cloudBulk=list=>cloudBatch(list,forCloud);
const cloudWipe=list=>cloudBatch(list,c=>({id:c.id,deleted:true,updated:Date.now()}));
function stopSync(){stok++;if(unsub){unsub();unsub=null}reconciled=false}
function startSync(u){
 stopSync();const tk=stok;
 if(!fs){setSync('sy_off');return}
 setSync('sy_on');
 unsub=fs.collection('users').doc(u.uid).collection('contacts').onSnapshot(async snap=>{
  if(tk!==stok)return;
  const loc=new Map(contacts.map(c=>[c.id,c])),put=[],del=[];
  snap.docChanges().forEach(ch=>{
   if(ch.type==='removed')return;
   const r=ch.doc.data(),id=ch.doc.id,l=loc.get(id);
   if(r.deleted){if(l)del.push(id);return}
   if(!l||(r.updated||0)>(l.updated||0))put.push(norm(r,id))});
  if(put.length||del.length){
   try{if(put.length)await dbBulk(put);for(const id of del)await dbDel(id)}catch(e){console.warn(e)}
   if(tk!==stok)return;
   const dm=new Set(del),pm=new Map(put.map(c=>[c.id,c]));
   contacts=contacts.filter(c=>!dm.has(c.id)).map(c=>pm.get(c.id)||c);
   for(const c of put)if(!loc.has(c.id))contacts.push(c);
   if(unlocked)render()}
  if(!reconciled&&!snap.metadata.fromCache){
   reconciled=true;
   const m=new Map();snap.docs.forEach(d=>m.set(d.id,d.data()));
   const up=contacts.filter(c=>{const r=m.get(c.id);return !r||(!r.deleted&&(c.updated||c.created||0)>(r.updated||0))});
   up.forEach(c=>{if(!c.updated)c.updated=c.created||Date.now()});
   if(up.length)cloudBulk(up)}
  setSync(snap.metadata.fromCache||snap.metadata.hasPendingWrites?'sy_wait':'sy_ok')
 },e=>cloudErr(e))}
window.addEventListener('online',()=>{if(canCloud()&&!unsub)startSync(cloudUser)});

async function save(c){c.updated=Date.now();await dbPut(c);cloudPut(c)}
async function saveMany(list){const now=Date.now();list.forEach(c=>c.updated=now);await dbBulk(list);cloudBulk(list)}
async function hardDelete(ids){const s=new Set(ids);for(const id of ids){await dbDel(id);cloudDel(id)}contacts=contacts.filter(c=>!s.has(c.id));viewedIds=viewedIds.filter(i=>!s.has(i));await setM('viewed',viewedIds)}
async function trashList(list){const now=Date.now();list.forEach(c=>c.trashed=now);await saveMany(list)}
async function purgeOld(){const old=contacts.filter(c=>c.trashed&&Date.now()-c.trashed>30*864e5);if(old.length)await hardDelete(old.map(c=>c.id))}
function findDupPhone(c){
 const mine=new Set(c.phones.map(p=>pk(p.v)).filter(Boolean));if(!mine.size)return null;
 return act().find(o=>o.id!==c.id&&o.phones.some(p=>mine.has(pk(p.v))))||null}
async function viewed(id){if(!P.track)return;viewedIds=[id,...viewedIds.filter(x=>x!==id)].slice(0,20);await setM('viewed',viewedIds)}

let imp=null;
async function startImportFiles(files){
 let all=[];
 for(const f of files){
  if(f.size>20*1024*1024){toast(t('imp_big'),'er');return}
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  try{const tx=await readText(f);
   if(ext==='vcf'||/BEGIN:VCARD/i.test(tx.slice(0,2000)))all=all.concat(parseVCF(tx));
   else if(ext==='csv'||ext==='txt')all=all.concat(csvToContacts(parseCSV(tx)));
   else{toast(t('imp_type',{f:f.name}),'er');return}
  }catch(e){toast(t('imp_bad',{f:f.name,e:e.message}),'er');return}}
 prepareImport(all)}
function prepareImport(all){
 if(!all.length){toast(t('imp_none'),'er');return}
 const ix=idxNew();act().forEach(c=>idxAdd(ix,c));
 const flags=all.map(c=>{const d=idxHas(ix,c);idxAdd(ix,c);return d});
 imp={all,flags};const dn=flags.filter(Boolean).length;
 modal(t('imp_title'),`<div class="pv"><b>${E(t('imp_sum',{a:all.length,b:all.length-dn,c:dn}))}</b></div><label class="ck"><input type="checkbox" id="impSkip" checked> ${E(t('imp_skip'))}</label>`,`<button class="btn t" data-close>${E(t('cancel'))}</button><button class="btn p" data-act="impgo">${E(t('imp_go'))}</button>`)}
async function doImport(){
 const skip=$('#impSkip').checked;const add=imp.all.filter((c,i)=>!(skip&&imp.flags[i]));const d=imp.all.length-add.length;
 const now=Date.now();add.forEach(c=>{c.created=now;c.updated=now});
 if(add.length){await dbBulk(add);cloudBulk(add);contacts=contacts.concat(add);
  const nl=[...new Set(add.flatMap(c=>c.labels))].filter(l=>!groupsMeta.includes(l));if(nl.length){groupsMeta.push(...nl);await saveGroups()}}
 $('#mDlg').close();imp=null;render();toast(d?t('imp_ok2',{n:add.length,d}):t('imp_ok',{n:add.length}),'sc')}
$('#impIn').onchange=e=>{const f=[...e.target.files];e.target.value='';if(f.length)startImportFiles(f)};

async function aesKey(pass,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptStr(str,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await aesKey(pass,salt),new TextEncoder().encode(str));return JSON.stringify({app:'contact-backup',enc:true,v:2,salt:b64(salt),iv:b64(iv),data:b64(new Uint8Array(ct))})}
async function decryptObj(o,pass){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},await aesKey(pass,unb64(o.salt)),unb64(o.data));return JSON.parse(new TextDecoder().decode(pt))}
async function doBackup(){
 const pass=await ask({title:t('backup'),msg:t('bk_msg'),input:{label:t('bk_pass'),type:'password'},ok:t('backup')});
 if(pass===null)return;
 const payload=JSON.stringify({app:'contact-backup',v:2,date:Date.now(),contacts,groups:groupNames(),prefs:{lang:P.lang,theme:P.theme,order:P.order,dens:P.dens,sub:P.sub,photos:P.photos,cc:P.cc}});
 const data=pass?await encryptStr(payload,pass):payload;
 const fn='contact-backup-'+day()+(pass?'-enc':'')+'.json';dl(fn,'application/json',data);
 lastBackup=Date.now();await setM('lastBackup',lastBackup);toast(t('bk_ok',{f:fn}),'sc');if(unlocked)render()}
async function startRestore(f){
 if(f.size>200*1024*1024){toast(t('imp_big'),'er');return}
 let o;try{o=JSON.parse(await readText(f))}catch{toast(t('bk_invalid'),'er');return}
 if(o&&o.enc&&o.app==='contact-backup'){
  const pass=await ask({title:t('restore_t'),msg:t('bk_need_pass'),input:{label:t('bk_pass'),type:'password'},ok:t('ok')});
  if(!pass)return;try{o=await decryptObj(o,pass)}catch{toast(t('bk_bad_pass'),'er');return}}
 if(!o||o.app!=='contact-backup'||!Array.isArray(o.contacts)){toast(t('bk_invalid'),'er');return}
 const list=o.contacts.filter(x=>x&&typeof x==='object').map(x=>norm(x,x.id));
 imp={bk:o,list};
 modal(t('restore_t'),`<div class="pv"><b>${E(t('bk_info',{d:o.date?fmtDate(o.date):'?',n:list.length}))}</b></div><label class="ck"><input type="radio" name="rmode" value="merge" checked> ${E(t('bk_merge'))}</label><label class="ck"><input type="radio" name="rmode" value="replace"> ${E(t('bk_replace'))}</label>`,`<button class="btn t" data-close>${E(t('cancel'))}</button><button class="btn p" data-act="rgo">${E(t('restore'))}</button>`)}
async function doRestore(){
 const mode=$('input[name=rmode]:checked').value,{bk,list}=imp;
 if(mode==='replace'){
  if(!await ask({title:t('restore_t'),msg:t('bk_replace_c'),ok:t('restore'),danger:true}))return;
  cloudWipe(contacts.filter(c=>!list.some(x=>x.id===c.id)));await dbClear();contacts=[];
  await dbBulk(list);cloudBulk(list);contacts=list;
  toast(t('bk_done2',{n:list.length}),'sc')}
 else{
  const loc=new Map(contacts.map(c=>[c.id,c]));let a=0,b=0;const put=[];
  for(const c of list){const l=loc.get(c.id);if(!l){put.push(c);a++}else if((c.updated||0)>(l.updated||0)){put.push(c);b++}}
  if(put.length){await dbBulk(put);cloudBulk(put);const pm=new Map(put.map(c=>[c.id,c]));contacts=contacts.map(c=>pm.get(c.id)||c);for(const c of put)if(!loc.has(c.id))contacts.push(c)}
  toast(t('bk_done',{a,b}),'sc')}
 if(Array.isArray(bk.groups)){groupsMeta=[...new Set([...groupsMeta,...bk.groups.map(S).filter(Boolean)])];await saveGroups()}
 $('#mDlg').close();imp=null;render()}
